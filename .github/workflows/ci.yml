name: Testy

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  testy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 to minimum deklarowane w README, 3.13 to wersja robocza.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Ustaw Pythona ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Logika gry to czysty stdlib — najpierw testy bez żadnych pakietów,
      # żeby tryb tekstowy (--tekst) nie zaczął po cichu zależeć od pygame.
      - name: Sprawdź, że wszystkie moduły się importują
        run: python -c "import main"

      - name: Testy logiki (bez pygame)
        run: python -m unittest discover -s tests -v

      - name: Zainstaluj grafikę (pygame-ce)
        run: python -m pip install -r requirements.txt

      # SDL_VIDEODRIVER=dummy — okno renderuje się bez monitora.
      - name: Testy z grafiką
        env:
          SDL_VIDEODRIVER: dummy
        run: python -m unittest discover -s tests -v
